[package]
name = "binlens"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["raidshadowmc-sudo"]
description = "Fast memory-mapped binary inspection, Shannon entropy profiling, Authenticode digest verification, YARA scanning, and security mitigation auditor for PE, ELF, and Mach-O binaries"
readme = "README.md"
license = "MIT"
repository = "https://github.com/raidshadowmc-sudo/binlens"
keywords = ["binary", "reverse-engineering", "checksec", "security", "entropy"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
boreal = "1.3.0"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
iced-x86 = "1.21.0"
md-5 = "0.11.0"
memmap2 = "0.9.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"

[lints.clippy]
collapsible_if = "allow"
