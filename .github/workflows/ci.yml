name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies (pefile for differential tests)
      run: |
        python -m pip install --upgrade pip
        pip install pefile

    - name: Check Formatting
      run: cargo fmt -- --check

    - name: Clippy Linter
      run: cargo clippy --locked --all-targets -- -D warnings -A clippy::collapsible_if -A clippy::collapsible_match

    - name: Cargo Test
      run: cargo test --locked --verbose

    - name: Build Release Binary
      run: cargo build --release --locked

    - name: Run Binary Release Gate (relgate)
      uses: raidshadowmc-sudo/relgate@v0.1.1
      with:
        binary: ${{ matrix.os == 'windows-latest' && 'target/release/binlens.exe' || 'target/release/binlens' }}
        fail-on-degraded: true
        require-aslr: true
        require-dep: true
        fail-on-rwx: true

